name: CI

# Runs on every push to main and on every pull request.
# The green tick on your repo is what a reviewer looks at first.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: pytest -q

      - name: Run the docstring examples
        run: pytest --doctest-modules datapulse -o addopts="" -q

      - name: Smoke-test the end-to-end demo
        run: python main.py --rows 1500 --no-reports --log-level WARNING

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting and style
        run: ruff check datapulse tests main.py --output-format=github
        continue-on-error: true   # advisory for now; flip to false once the repo is clean
